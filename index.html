<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#0a1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="다낭 여행" />
<title>다낭 가족여행</title>

<script>
  window.gmapsReady = false;
  window.initGMaps = () => {
    window.gmapsReady = true;
    window.dispatchEvent(new CustomEvent('gmaps-ready'));
  };
</script>
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDrOQN-gpIHZoC3t-l9z_8uC_c3m9kpcW4&loading=async&libraries=marker&callback=initGMaps&v=weekly&language=ko&region=VN">
</script>

<style>
  :root{
    /* 모던 팔레트: 심야 인디고 + 글로우 */
    --bg:#0b0d1e; --bg2:#1a1235; --bg3:#2a0e3a;
    --panel:rgba(20,22,45,.72); --panel-solid:#141633;
    --ink:#f5f7fb; --sub:#9ba3c4;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
    --brand:#5eead4; --brand2:#f472b6; --brand3:#a78bfa; --ok:#4ade80;
    --card:rgba(30,32,58,.55); --card2:rgba(40,42,72,.65);
    --card-solid:#1e2038;
    --sand:#fbbf24; --sky:#7dd3fc;
    /* 카테고리 색 (선명하되 조화롭게) */
    --food:#f472b6; --spa:#c084fc; --nail:#fb7185; --shop:#fbbf24;
    --sight:#5eead4; --stay:#fb923c; --cafe:#a3e635; --move:#7dd3fc;
    --shadow-lg:0 20px 60px rgba(0,0,0,.4), 0 8px 24px rgba(94,234,212,.08);
    --shadow-md:0 8px 24px rgba(0,0,0,.3);
    --shadow-glow:0 0 40px rgba(167,139,250,.25);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  @keyframes aurora{0%,100%{background-position:0% 50%;transform:translateY(0)}50%{background-position:100% 50%;transform:translateY(-2%)}}
  html,body{margin:0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
    font-size:16px;line-height:1.5;
    overscroll-behavior-y:contain;
  }
  body{max-width:500px;margin:0 auto;min-height:100vh;position:relative;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(167,139,250,.18), transparent),
      radial-gradient(ellipse 60% 40% at 100% 20%, rgba(94,234,212,.12), transparent),
      radial-gradient(ellipse 60% 40% at 0% 40%, rgba(244,114,182,.10), transparent),
      linear-gradient(180deg, #0b0d1e 0%, #12102a 40%, #0b0d1e 100%);
    background-attachment:fixed;
  }
  button, input, textarea, select{font-family:inherit}
  button{cursor:pointer;background:none;border:none;color:inherit;padding:0}
  a{color:var(--brand);text-decoration:none}

  /* ─── 레이아웃 ─── */
  .screen{display:none;padding-top:var(--safe-top);padding-bottom:calc(100px + var(--safe-bot));min-height:100vh}
  .screen.on{display:block}
  .header{padding:18px 20px 8px;position:sticky;top:0;background:linear-gradient(180deg,#0b0d1e 0%,rgba(11,13,30,.9) 60%,rgba(11,13,30,0));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10}
  .header h1{font-size:28px;font-weight:900;margin:0;letter-spacing:-0.6px;background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#5eead4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .header .sub{color:var(--sub);font-size:13px;margin-top:4px;font-weight:500}
  .header .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .body-p{padding:8px 16px 20px}

  /* ─── 탭바 ─── */
  .tabbar{position:fixed;bottom:14px;left:14px;right:14px;max-width:472px;margin:0 auto;height:64px;padding:6px;background:rgba(20,22,45,.75);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.08);border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;z-index:50;box-shadow:0 20px 40px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.03) inset}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:11px;font-weight:600;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:16px;position:relative}
  .tab .ic{font-size:22px;line-height:1;transition:transform .2s}
  .tab.on{color:#fff;background:linear-gradient(135deg,rgba(94,234,212,.25),rgba(167,139,250,.25));box-shadow:0 4px 12px rgba(94,234,212,.2)}
  .tab.on .ic{transform:scale(1.08)}
  .tab:active{transform:scale(.94)}

  /* ─── 공통 컴포넌트 ─── */
  .card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:16px;border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--shadow-md);transition:transform .15s, border-color .2s}
  .card:hover{border-color:var(--line-strong)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .muted{color:var(--sub);font-size:13px}
  .h3{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin:20px 4px 12px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:11px 16px;border-radius:14px;background:rgba(255,255,255,.06);color:var(--ink);font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.08);transition:all .15s;backdrop-filter:blur(10px)}
  .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)}
  .btn.primary{background:linear-gradient(135deg,#5eead4 0%,#a78bfa 100%);color:#0b0d1e;border-color:transparent;font-weight:700;box-shadow:0 4px 16px rgba(94,234,212,.3)}
  .btn.primary:hover{box-shadow:0 6px 20px rgba(94,234,212,.4)}
  .btn.block{display:flex;width:100%;justify-content:center;padding:14px}
  .btn:active{transform:scale(.97)}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.06);color:#c8d0e0;border:1px solid rgba(255,255,255,.06)}
  .chip.on{background:var(--brand);color:#0a1220}
  .chip.stay{background:rgba(251,146,60,.18);color:var(--stay)}
  .chip.food{background:rgba(251,113,133,.18);color:var(--food)}
  .chip.spa{background:rgba(192,132,252,.18);color:var(--spa)}
  .chip.nail{background:rgba(244,114,182,.18);color:var(--nail)}
  .chip.shop{background:rgba(251,191,36,.18);color:var(--shop)}
  .chip.sight{background:rgba(45,212,191,.18);color:var(--sight)}
  .chip.cafe{background:rgba(163,230,53,.18);color:var(--cafe)}
  .chip.move{background:rgba(56,189,248,.18);color:var(--move)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--sub);font-size:14px}
  .loading::before{content:"";width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ─── 홈 ─── */
  .hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#a78bfa 0%,#f472b6 40%,#5eead4 100%);background-size:200% 200%;animation:aurora 8s ease-in-out infinite;border-radius:24px;padding:24px;color:#fff;margin-bottom:14px;box-shadow:0 20px 40px rgba(167,139,250,.35), inset 0 1px 0 rgba(255,255,255,.15)}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%, rgba(255,255,255,.25), transparent 40%);pointer-events:none}
  .hero > *{position:relative}
  .hero .dday{font-size:60px;font-weight:900;line-height:.95;letter-spacing:-2px;text-shadow:0 2px 20px rgba(0,0,0,.2)}
  .hero .caption{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .hero .dates{font-size:14px;margin-top:14px;font-weight:700;opacity:.95;letter-spacing:.2px}
  .today-card{background:linear-gradient(160deg,rgba(94,234,212,.12),rgba(167,139,250,.08));border:1px solid rgba(94,234,212,.25);border-radius:20px;padding:18px;margin-bottom:14px;backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(94,234,212,.08)}
  .today-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .today-tag{background:linear-gradient(135deg,#5eead4,#a78bfa);color:#0b0d1e;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.3px;box-shadow:0 4px 12px rgba(94,234,212,.3)}
  .today-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
  .today-item:first-of-type{border-top:0}
  .ti-time{flex:0 0 50px;font-size:14px;font-weight:700;color:var(--brand);padding-top:2px}
  .ti-body{flex:1;font-size:15px}
  .mini{background:rgba(30,32,58,.55);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .15s, border-color .2s}
  .mini:hover{border-color:var(--line-strong)}
  .mini .lbl{color:var(--sub);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
  .mini .val{font-size:20px;font-weight:900;margin-top:6px;letter-spacing:-.3px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .mini .sm{color:var(--sub);font-size:12px;margin-top:4px;font-weight:500}

  /* ─── 일정 ─── */
  .day-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{flex:0 0 auto;min-width:78px;padding:14px 16px;border-radius:18px;background:rgba(30,32,58,.55);backdrop-filter:blur(20px);border:1px solid var(--line);text-align:center;position:relative;transition:all .2s cubic-bezier(.4,0,.2,1);cursor:pointer}
  .day-tab:hover{border-color:var(--line-strong);transform:translateY(-2px)}
  .day-tab .dt-date{font-size:18px;font-weight:900;color:var(--ink);line-height:1;letter-spacing:-.5px}
  .day-tab .dt-day{font-size:12px;color:var(--sub);margin-top:5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
  .day-tab .dt-count{background:var(--sub);color:var(--bg);font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;line-height:1.4;min-width:18px;text-align:center}
  .day-tab.on{background:linear-gradient(135deg,#5eead4,#a78bfa);border-color:transparent;box-shadow:0 10px 30px rgba(94,234,212,.35), 0 2px 8px rgba(167,139,250,.2);transform:translateY(-2px)}
  .day-tab.on .dt-date,.day-tab.on .dt-day{color:#0b0d1e}
  .day-tab.on .dt-count{background:#0b0d1e;color:#5eead4}
  .timeline{position:relative;padding-left:22px;margin-top:4px}
  .timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,rgba(94,234,212,.6),rgba(167,139,250,.6),rgba(244,114,182,.4));border-radius:2px;box-shadow:0 0 12px rgba(94,234,212,.3)}
  .tl-item{position:relative;margin-bottom:14px}
  .tl-item::before{content:"";position:absolute;left:-20px;top:8px;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#5eead4,#a78bfa);border:3px solid #0b0d1e;box-shadow:0 0 0 2px rgba(94,234,212,.5), 0 0 12px rgba(94,234,212,.6)}
  .tl-time{font-size:13px;background:linear-gradient(135deg,#5eead4,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;margin-bottom:6px;letter-spacing:.3px}
  .tl-card{background:rgba(30,32,58,.55);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:14px;transition:all .15s}
  .tl-card:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .tl-card .name{font-weight:700;font-size:16px}
  .tl-card .memo{color:var(--sub);font-size:13px;margin-top:6px;line-height:1.5}

  /* ─── 지도 ─── */
  .search-bar{display:flex;align-items:center;gap:10px;background:rgba(30,32,58,.6);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:16px;transition:border-color .15s}
  .search-bar:focus-within{border-color:rgba(94,234,212,.4);box-shadow:0 0 0 3px rgba(94,234,212,.1)}
  .search-bar input{border:0;background:transparent;padding:0;font-size:15px;color:var(--ink);flex:1;outline:none}
  .search-bar input::placeholder{color:var(--sub)}
  .filter-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-bar .chip{flex:0 0 auto;user-select:none;cursor:pointer}
  .map-wrap{border-radius:22px;overflow:hidden;border:1px solid var(--line);position:relative;background:#1a2338;box-shadow:var(--shadow-lg)}
  #mapMain{width:100%;height:60vh;min-height:340px}
  /* 핀: 34x44 컨테이너, 팁이 (17,44) 위치 = Google 기본 앵커 (bottom-center)와 정확히 일치 */
  .gmap-marker{width:34px;height:44px;position:relative;cursor:pointer;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5));transition:transform .1s}
  .gmap-marker:hover{transform:scale(1.1);transform-origin:center bottom}
  .gmap-marker svg{display:block;position:absolute;top:0;left:0;pointer-events:none}
  .gmap-marker .emoji{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:15px;line-height:1;pointer-events:none}
  .gmap-marker.stay-marker{filter:drop-shadow(0 4px 10px rgba(251,146,60,.6)) drop-shadow(0 3px 5px rgba(0,0,0,.4))}
  .gmap-info{padding:2px 4px;font-size:13px;color:#111;max-width:200px}
  .gmap-info b{font-size:14px;display:block;margin-bottom:2px}
  .gmap-info a{color:#0891b2;font-weight:600;font-size:12px}
  /* Google Maps 다크 팝업 */
  .gm-style-iw{background:var(--card)!important;color:var(--ink)!important;border-radius:12px!important;padding:10px!important}
  .gm-style-iw-d{overflow:auto!important;color:var(--ink)!important}
  .gm-style-iw-c{padding:8px!important;background:var(--card)!important}
  .gm-style-iw-tc::after{background:var(--card)!important}
  .gm-ui-hover-effect{filter:invert(1)}

  /* ─── 장소 리스트 ─── */
  .place-item{display:flex;gap:14px;padding:16px;background:rgba(30,32,58,.55);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-md)}
  .place-item:hover{border-color:var(--line-strong);transform:translateY(-2px)}
  .place-item:active{transform:scale(.98)}
  .place-thumb{width:56px;height:56px;border-radius:12px;flex:0 0 56px;display:flex;align-items:center;justify-content:center;font-size:26px}
  .place-body{flex:1;min-width:0}
  .place-name{font-weight:700;font-size:16px}
  .place-vn{color:var(--sub);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place-meta{display:flex;gap:10px;margin-top:8px;color:var(--sub);font-size:13px;flex-wrap:wrap}

  /* ─── 정보 ─── */
  .conv-card{background:linear-gradient(135deg,rgba(94,234,212,.14) 0%,rgba(167,139,250,.14) 50%,rgba(244,114,182,.10) 100%);backdrop-filter:blur(24px);border:1px solid rgba(167,139,250,.25);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05)}
  .conv-row{display:flex;gap:10px;align-items:center}
  .conv-col{flex:1}
  .conv-lbl{color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .conv-input{width:100%;background:transparent;border:0;color:var(--ink);font-size:30px;font-weight:800;padding:2px 0;outline:none;margin-top:4px;letter-spacing:-.5px}
  .conv-input[readonly]{background:linear-gradient(135deg,#5eead4,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .conv-swap{background:linear-gradient(135deg,rgba(94,234,212,.2),rgba(167,139,250,.2));border:1px solid rgba(167,139,250,.35);width:44px;height:44px;border-radius:50%;color:var(--brand);font-size:18px;flex:0 0 44px;cursor:pointer;transition:transform .15s}
  .conv-swap:hover{transform:rotate(180deg)}
  .conv-rate{color:var(--sub);font-size:13px;text-align:center;margin-top:14px;font-weight:600}
  .phrase-cat{font-size:13px;font-weight:800;background:linear-gradient(135deg,#5eead4,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:18px 4px 10px;letter-spacing:.4px;text-transform:uppercase}
  .phrase{display:flex;align-items:center;gap:12px;background:rgba(30,32,58,.55);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;transition:all .15s}
  .phrase:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .phrase .ko{flex:0 0 96px;font-size:14px;color:var(--sub);font-weight:600}
  .phrase .vn{flex:1;font-size:15px;font-weight:600;color:var(--ink);line-height:1.4}
  .phrase .pron{color:var(--sub);font-size:12px;font-weight:400;display:block;margin-top:2px}
  .phrase .spk{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,rgba(94,234,212,.18),rgba(167,139,250,.18));border:1px solid rgba(167,139,250,.3);color:var(--brand);font-size:16px;flex:0 0 40px;cursor:pointer;transition:transform .15s}
  .phrase .spk:hover{transform:scale(1.1)}

  /* ─── 상세 시트 (bottom sheet) ─── */
  .sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:none;animation:fadeIn .2s}
  .sheet-back.on{display:block}
  .sheet{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:linear-gradient(180deg,rgba(26,18,53,.92) 0%,rgba(11,13,30,.96) 100%);backdrop-filter:blur(30px) saturate(180%);border-radius:28px 28px 0 0;border-top:1px solid rgba(167,139,250,.2);z-index:101;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto;padding-bottom:calc(20px + var(--safe-bot));overscroll-behavior:contain;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
  .sheet.on{transform:translateY(0)}
  .sheet-header{position:sticky;top:0;background:linear-gradient(180deg,rgba(26,18,53,.9) 0%,rgba(26,18,53,.7) 70%,rgba(26,18,53,0));backdrop-filter:blur(20px);z-index:5;padding:10px 16px 6px;display:flex;justify-content:center;align-items:center;position:relative}
  .sheet-drag{width:44px;height:5px;background:linear-gradient(90deg,#5eead4,#a78bfa);border-radius:3px;cursor:grab;opacity:.7}
  .sheet-drag:active{cursor:grabbing}
  .sheet-close{position:absolute;right:14px;top:8px;width:38px;height:38px;border-radius:50%;background:rgba(30,32,58,.75);backdrop-filter:blur(12px);border:1px solid var(--line-strong);color:var(--ink);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
  .sheet-close:hover{background:rgba(244,114,182,.15);border-color:rgba(244,114,182,.4)}
  .sheet-close:active{transform:scale(.9)}
  .sheet-body{padding:6px 20px 20px}
  .sheet .cover{height:150px;border-radius:20px;position:relative;overflow:hidden;margin-bottom:14px;display:flex;align-items:flex-end;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
  .sheet .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5));pointer-events:none}
  .sheet .cover .badge{background:rgba(0,0,0,.5);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);position:relative;z-index:1}
  .addr-copy{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(15,17,35,.6);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

};

/* ═══════════════════════════════════════

const state = {
  places: [], plan: [], phrases: [], people: [], checklist: [],
  loaded: false, error: null,
  activeDay: 'D1',
  mapFilters: new Set(),
  placesFilter: null,
  mapMain: null,

async function fetchSheet(name, bustCache=false){
  // opensheet는 추가 쿼리파라미터를 거부(400)함 → 브라우저 fetch 옵션으로만 캐시 우회
  const url = `https://opensheet.elk.sh/${CONFIG.SHEET_ID}/${encodeURIComponent(name)}`;
  const opts = bustCache ? {cache: 'no-store'} : {};
  try {
    const r = await fetch(url, opts);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if(!Array.isArray(data)) throw new Error('데이터 형식 오류');
    return data;
  } catch(e) {
    console.warn('[Sheet fetch failed]', name, e.message);
    return null;
  }
}

async function loadAll(bustCache=false){
  state.error = null; // 매 로드마다 에러 초기화
  const [places, plan, phrases] = await Promise.all([
    fetchSheet('장소', bustCache),
    fetchSheet('일정', bustCache),
    fetchSheet('회화', bustCache),
  ]);

  // 하나라도 실패하면: 기존 데이터 유지 (덮어쓰기 X)
  if(!places && !plan && !phrases){
    // 전부 실패 → 네트워크 문제
    state.error = '네트워크 오류. 잠시 후 다시 시도해주세요.';
    return;
  }
  if(!places || !plan){
    // 필수 데이터 실패
    state.error = '일부 시트를 불러오지 못했습니다. 시트 공유 설정을 확인해주세요.';
    return;
  }

  state.places = places.filter(p => p['이름_한글'] || p['이름(한글)']).map(p => ({
    id: p['ID'] || '',
    name: p['이름_한글'] || p['이름(한글)'] || '',
    nameVn: p['이름_현지'] || p['이름(현지)'] || '',
    cat: (p['카테고리'] || '기타').trim(),
    addr: p['주소'] || p['주소(베트남어)'] || '',
    lat: parseFloat(p['위도']) || null,
    lng: parseFloat(p['경도']) || null,
    price: p['가격대'] || '',
    hours: p['영업시간'] || '',
    reserve: p['예약필요'] || '',
    kids: p['유아가능'] || '',
    rating: p['별점'] || '',
    memo: p['메모'] || '',
    mapUrl: p['구글맵링크'] || '',
  }));

  state.plan = plan.filter(p => p['일차']).map(p => ({
    day: p['일차'] || '',
    date: p['날짜'] || '',
    dow: p['요일'] || '',
    time: p['시간'] || '',
    placeId: p['장소ID'] || '',
    name: p['장소이름'] || '',
    cat: (p['카테고리'] || '기타').trim(),
    memo: p['메모'] || '',
    done: p['완료'] || '',
  }));

  state.phrases = (phrases || []).filter(p => p['한국어']).map(p => ({
    cat: p['카테고리'] || '기타',
    ko: p['한국어'] || '',
    vn: p['베트남어'] || '',
    pron: p['한글발음'] || '',

  }));

  state.loaded = true;
  state.lastSync = Date.now();
}

// 시트에서 새로고침
async function refreshData(){
  const btn = document.getElementById('fab-refresh');
  const sync = document.getElementById('last-sync');
  btn.classList.add('loading');
  sync.classList.remove('on');
  toast('시트에서 데이터 불러오는 중...');
  // 이전 상태 백업 (실패 시 롤백)
  const backup = {places: state.places, plan: state.plan, phrases: state.phrases};
  await loadAll(true);
  btn.classList.remove('loading');
  if(state.error){
    // 실패 시 이전 데이터 유지 (화면 유지)
    state.places = backup.places;
    state.plan = backup.plan;
    state.phrases = backup.phrases;
    toast('❌ ' + state.error);
    console.warn('[Refresh 실패 — 이전 데이터 유지]');
    return;
  }
  // 모든 화면 재렌더
  renderHome();
  renderPlanTabs();
  renderPlanBody();
  renderMapFilters();
  renderPlaces();
  renderPhrases(document.getElementById('phrase-search').value);
  if(state.mapMain) renderMapMarkers();
  toast(`✓ ${state.places.length}개 장소 · ${state.plan.length}개 일정`);
  updateSyncLabel();
}

function updateSyncLabel(){
  if(!state.lastSync) return;
  const sync = document.getElementById('last-sync');
  const diff = Math.floor((Date.now() - state.lastSync) / 1000);
  let text;
  if(diff < 5) text = '방금 업데이트';
  else if(diff < 60) text = `${diff}초 전 업데이트`;
  else if(diff < 3600) text = `${Math.floor(diff/60)}분 전 업데이트`;
  else text = `${Math.floor(diff/3600)}시간 전 업데이트`;
  sync.textContent = '🕐 ' + text;
  sync.classList.add('on');
  clearTimeout(state.syncLabelTimer);
  state.syncLabelTimer = setTimeout(() => sync.classList.remove('on'), 3500);
}

/* ═══════════════════════════════════════
   유틸
   ═══════════════════════════════════════ */
function dayLabel(d){
  const days = {D1:'10/22', D2:'10/23', D3:'10/24', D4:'10/25', D5:'10/26'};
  const dows = {D1:'목', D2:'금', D3:'토', D4:'일', D5:'월'};
  return {date:days[d]||'', dow:dows[d]||'', full:d};
}
function ddayText(){
  const t = new Date(CONFIG.TRIP_START + 'T00:00:00+09:00');
  const now = new Date();
  const diff = Math.ceil((t - now) / 86400000);
  if(diff > 0) return {label:'출발까지', dday:`D-${diff}`};
  if(diff === 0) return {label:'오늘', dday:'D-Day'};
  const end = new Date(CONFIG.TRIP_END + 'T23:59:59+09:00');
  if(now <= end) return {label:'여행 중', dday:`D+${-diff}`};
  return {label:'여행 종료', dday:'-'};
}
function currentDayCode(){
  // 오늘 날짜에 맞는 D1~D5 반환 (없으면 null)
  const map = {'2026-10-22':'D1','2026-10-23':'D2','2026-10-24':'D3','2026-10-25':'D4','2026-10-26':'D5'};
  const today = new Date().toISOString().slice(0,10);
  return map[today] || null;
}
function cat(name){ return CATS[name] || CATS.기타; }
// 시트의 카테고리='숙소'인 장소들 (등록 순서 유지)
function getStays(){ return state.places.filter(p => p.cat === '숙소'); }
// 두 좌표 사이 거리 (km, Haversine)
function distanceKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatDist(km){
  if(km < 1) return `${Math.round(km * 1000)}m`;
  return `${km.toFixed(1)}km`;
}
function wonFromVnd(v){ return Math.round(v * CONFIG.RATE_VND_TO_KRW); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1800);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('복사됨'); }
  catch { toast('복사 실패 — 길게 눌러 복사'); }
}

function switchTab(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.getElementById('screen-' + name).classList.add('on');
  document.querySelector(`[data-tab="${name}"]`).classList.add('on');
  window.scrollTo(0, 0);
  // 지도 탭 활성화되면 초기화 or 사이즈 재계산
  if(name === 'map'){
    if(!state.mapMain) initMap();
    else setTimeout(() => google.maps.event.trigger(state.mapMain, 'resize'), 100);
  }
  if(name === 'home' && state.mapHome){
    setTimeout(() => google.maps.event.trigger(state.mapHome, 'resize'), 100);
  }
  if(name === 'plan' && state.mapPlan){
    setTimeout(() => google.maps.event.trigger(state.mapPlan, 'resize'), 100);
  }
}

      <div class="dt-date">${info.date}</div>

    </div>`;
  }).join('');
  el.querySelectorAll('.day-tab').forEach(t => t.addEventListener('click', () => {
    state.activeDay = t.dataset.day;
    renderPlanTabs();
    renderPlanBody();
  }));
}
function renderPlanBody(){
  const el = document.getElementById('day-body');
  const items = state.plan.filter(p => p.day === state.activeDay);
  if(items.length === 0){
    el.innerHTML = `<div class="loading" style="padding:30px">이 날은 아직 등록된 일정이 없어요</div>`;
    document.getElementById('plan-map-wrap').hidden = true;
    return;
  }
  document.getElementById('plan-map-wrap').hidden = false;

  // 좌표 매핑: 장소ID → 장소 객체
  const enriched = items.map(t => {
    const p = t.placeId ? state.places.find(x => String(x.id) === String(t.placeId)) : null;
    return {
      ...t,
      globalIdx: state.plan.indexOf(t),
      place: p,
      lat: p ? p.lat : null,
      lng: p ? p.lng : null,
      addr: p ? p.addr : '',
    };
  });

  // 리스트 렌더 (번호 + 거리)
  let html = `<div class="plan-list">`;
  enriched.forEach((t, i) => {
    const c = cat(t.cat);
    const num = i + 1;
    html += `
      <div class="plan-row">
        <div class="plan-num" style="background:${c.c}">${num}</div>
        <div class="plan-card" onclick="openPlanItem(${t.globalIdx})">
          <div class="pc-time">${c.e} ${t.time || ''} · ${t.cat}</div>
          <div class="pc-name">${t.name}</div>
          ${t.addr ? `<div class="pc-sub">${t.addr}</div>` : ''}
          ${t.memo ? `<div class="pc-memo">💬 ${t.memo}</div>` : ''}
        </div>
      </div>
    `;
    // 다음 항목과의 거리 (좌표 둘 다 있을 때만)
    const next = enriched[i + 1];
    if(next && t.lat && t.lng && next.lat && next.lng){
      const km = distanceKm(t.lat, t.lng, next.lat, next.lng);
      html += `
        <div class="plan-dist">
          <div class="plan-dist-line"></div>
          <span class="plan-dist-badge">📍 ${formatDist(km)}</span>
        </div>
      `;
    } else if(next) {
      // 좌표 없을 때는 라인만
      html += `<div class="plan-dist"><div class="plan-dist-line"></div></div>`;
    }
  });
  html += `</div>`;
  el.innerHTML = html;

  // 지도 마커 렌더 (좌표 있는 항목만)
  renderPlanMap(enriched);
}

async function renderPlanMap(enriched){
  const withCoords = enriched.filter(t => t.lat && t.lng);
  const emptyEl = document.getElementById('plan-map-empty');
  // 진단 로그 (F12 콘솔에서 확인 가능)
  console.log('[renderPlanMap]', {
    day: state.activeDay,
    itemsCount: enriched.length,
    withCoordsCount: withCoords.length,
    placesLoaded: state.places.length,
    items: enriched.map(t => ({name: t.name, placeId: t.placeId, matched: !!t.place, lat: t.lat, lng: t.lng})),
  });
  if(withCoords.length === 0){
    if(emptyEl){
      // 상세 진단 메시지
      const total = enriched.length;
      const withPid = enriched.filter(t => t.placeId).length;
      const matched = enriched.filter(t => t.place).length;
      let msg;
      if(state.places.length === 0){
        msg = '📍 장소 데이터 없음 — 🔄 새로고침 눌러주세요';
      } else if(withPid === 0){
        msg = `📍 일정 ${total}개 모두 장소ID 비어있음<br><span style="font-size:11px">시트 [일정] 탭에서 장소ID 컬럼 채우기</span>`;
      } else if(matched < withPid){
        const missing = enriched.filter(t => t.placeId && !t.place).map(t => t.placeId).join(', ');
        msg = `📍 장소ID 매칭 실패 (참조: ${withPid} / 찾음: ${matched})<br><span style="font-size:11px">누락 ID: ${missing} · [장소] 시트 확인</span>`;
      } else {
        msg = '📍 매칭된 장소에 위도·경도 없음<br><span style="font-size:11px">[장소] 시트에서 위도·경도 확인</span>';
      }
      emptyEl.innerHTML = msg;
      emptyEl.hidden = false;
    }
    return;
  }
  if(emptyEl) emptyEl.hidden = true;

  if(!window.gmapsReady){
    window.addEventListener('gmaps-ready', () => renderPlanMap(enriched), {once:true});
    return;
  }
  const { Map } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

  if(!state.mapPlan){
    state.mapPlan = new Map(document.getElementById('mapPlan'), {
      center: {lat:16.055, lng:108.245}, zoom: 13,
      mapId: "DEMO_MAP_ID",
      disableDefaultUI: true,
      zoomControl: true,
      gestureHandling: 'greedy',
    });
  }
  // 기존 마커/경로 제거
  state.mapPlanMarkers.forEach(m => m.map = null);
  state.mapPlanMarkers = [];
  if(state.mapPlanRoute) state.mapPlanRoute.setMap(null);

  // 번호 마커
  const bounds = new google.maps.LatLngBounds();
  withCoords.forEach((t, i) => {
    const c = cat(t.cat);
    const num = enriched.indexOf(t) + 1;
    const marker = new AdvancedMarkerElement({
      position: {lat: t.lat, lng: t.lng},
      map: state.mapPlan,
      content: makeNumMarker(c.c, num),
      title: t.name,
      gmpClickable: true,
    });
    marker.addListener('click', () => openPlanItem(t.globalIdx));
    state.mapPlanMarkers.push(marker);
    bounds.extend({lat: t.lat, lng: t.lng});
  });

  // 경로 선 (순서대로 이어서)
  if(withCoords.length >= 2){
    state.mapPlanRoute = new google.maps.Polyline({
      path: withCoords.map(t => ({lat: t.lat, lng: t.lng})),
      geodesic: true,
      strokeColor: '#2dd4bf',
      strokeOpacity: 0.9,
      strokeWeight: 3,
      icons: [{
        icon: {path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 3, strokeColor:'#2dd4bf'},
        offset: '50%', repeat: '80px'
      }],
    });
    state.mapPlanRoute.setMap(state.mapPlan);
  }

  if(withCoords.length === 1) state.mapPlan.setZoom(15);
  state.mapPlan.fitBounds(bounds, 60);

  // 앵커 자가진단: 첫 마커의 '원 중심' 화면좌표 vs 해당 위경도의 실제 투영 화면좌표 비교
  if(withCoords.length){
    google.maps.event.addListenerOnce(state.mapPlan, 'idle', () => {
      setTimeout(() => checkAnchor(withCoords[0]), 300);
    });
  }
}

// 원 중심과 실제 좌표의 픽셀 오프셋을 콘솔에 출력 (0,0 이면 완벽 정렬)
function checkAnchor(target){
  try{
    const ov = new google.maps.OverlayView();
    ov.onAdd = function(){};
    ov.draw = function(){
      const proj = this.getProjection();
      if(!proj) return;
      const pt = proj.fromLatLngToContainerPixel(
        new google.maps.LatLng(target.lat, target.lng)
      );
      const mapRect = document.getElementById('mapPlan').getBoundingClientRect();
      const trueX = mapRect.left + pt.x, trueY = mapRect.top + pt.y;
      const circle = document.querySelector('#mapPlan .num-marker .circle');
      if(!circle) return;
      const r = circle.getBoundingClientRect();
      const dx = (r.left + r.width/2) - trueX;
      const dy = (r.top + r.height/2) - trueY;
      console.log(
        `%c[앵커 진단] dx=${dx.toFixed(1)}px  dy=${dy.toFixed(1)}px  ${Math.abs(dx)<2&&Math.abs(dy)<2?'✅ 정렬 OK':'❌ 어긋남'}`,
        'font-size:13px;font-weight:bold;color:' + (Math.abs(dx)<2&&Math.abs(dy)<2 ? '#10b981':'#ef4444')
      );
      ov.setMap(null);
    };
    ov.onRemove = function(){};
    ov.setMap(state.mapPlan);
  }catch(e){ console.warn('앵커 진단 실패', e); }
}

function makeNumMarker(color, num){
  const wrap = document.createElement('div');
  wrap.className = 'num-marker';
  wrap.innerHTML = `<div class="circle" style="background:${color}">${num}</div>`;
  // transform은 절대 건드리지 않는다 — Google의 앵커 transform과 충돌/이중적용되기 때문.
  // 정렬은 순수 CSS 박스 기하(.num-marker 34x17 + .circle bottom:-17px)로 처리됨.
  return wrap;
}

/* ═══════════════════════════════════════
   지도 렌더
   ═══════════════════════════════════════ */
function makePin(color, emoji, extraClass=''){
  const wrap = document.createElement('div');
  wrap.className = 'gmap-marker ' + extraClass;
  // SVG 핀: viewBox 34x44, path의 팁이 (17,44) — Google 기본 앵커와 정확히 일치
  wrap.innerHTML = `
    <svg width="34" height="44" viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 1 C8.2 1 1 8.2 1 17 c0 12.5 16 26 16 26 s16-13.5 16-26 C33 8.2 25.8 1 17 1 z"
            fill="${color}" stroke="#fff" stroke-width="2"/>
    </svg>
    <span class="emoji">${emoji}</span>
  `;
  return wrap;
}
function renderMapFilters(){
  const el = document.getElementById('map-filters');
  const all = Object.keys(CATS).filter(k => k !== '기타' && state.places.some(p => p.cat === k));
  const total = state.places.filter(p => p.lat && p.lng).length;
  el.innerHTML = `<span class="chip ${state.mapFilters.size === 0 ? 'on' : ''}" data-cat="">전체 ${total}</span>` +
    all.map(c => {
      const cnt = state.places.filter(p => p.cat === c && p.lat && p.lng).length;
      return `<span class="chip ${cat(c).chip} ${state.mapFilters.has(c) ? 'on' : ''}" data-cat="${c}">${cat(c).e} ${cnt}</span>`;
    }).join('');
  el.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    const c = chip.dataset.cat;
    if(c === '') state.mapFilters.clear();
    else {
      if(state.mapFilters.has(c)) state.mapFilters.delete(c);
      else state.mapFilters.add(c);
    }
    renderMapFilters();
    renderMapMarkers();
  }));
  document.getElementById('map-sub').textContent = `📍 ${total}곳 · ${state.places.length}개 등록됨`;
}
async function renderMapMarkers(){
  if(!state.mapMain) return;
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
  state.mapMarkers.forEach(m => m.map = null);
  state.mapMarkers = [];
  const filtered = state.places.filter(p => {
    if(!p.lat || !p.lng) return false;
    if(state.mapFilters.size === 0) return true;
    return state.mapFilters.has(p.cat);
  });
  const bounds = new google.maps.LatLngBounds();
  filtered.forEach(p => {
    const c = cat(p.cat);
    const marker = new AdvancedMarkerElement({
      position: {lat: p.lat, lng: p.lng},
      map: state.mapMain,
      content: makePin(c.c, c.e, p.cat === '숙소' ? 'stay-marker' : ''),
      title: p.name,
      gmpClickable: true,
    });
    marker.addListener('click', () => openPlace(p));
    state.mapMarkers.push(marker);
    bounds.extend({lat: p.lat, lng: p.lng});
  });
  if(filtered.length > 0){
    state.mapMain.fitBounds(bounds, 40);
    if(filtered.length === 1) state.mapMain.setZoom(15);
  }
}
async function initMap(){
  if(state.mapMain) return;
  if(!window.gmapsReady){
    window.addEventListener('gmaps-ready', initMap, {once:true});
    return;
  }
  const { Map } = await google.maps.importLibrary("maps");
  state.mapMain = new Map(document.getElementById('mapMain'), {
    center: {lat:16.055, lng:108.245}, zoom: 12,
    mapId: "DEMO_MAP_ID",
    disableDefaultUI: false,
    zoomControl: true,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
    clickableIcons: true,
    gestureHandling: 'greedy',
  });
  renderMapMarkers();
}

function renderPlaces(){
  const el = document.getElementById('places-list');
  const catNames = Object.keys(CATS).filter(k => state.places.some(p => p.cat === k));
  const fEl = document.getElementById('places-filters');
  fEl.innerHTML = `<span class="chip ${!state.placesFilter ? 'on' : ''}" data-cat="">전체 ${state.places.length}</span>` +
    catNames.map(c => {
      const cnt = state.places.filter(p => p.cat === c).length;
      return `<span class="chip ${cat(c).chip} ${state.placesFilter === c ? 'on' : ''}" data-cat="${c}">${cat(c).e} ${cnt}</span>`;
    }).join('');
  fEl.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    state.placesFilter = chip.dataset.cat || null;
    renderPlaces();
  }));

  const filtered = state.placesFilter ? state.places.filter(p => p.cat === state.placesFilter) : state.places;
  if(filtered.length === 0){
    el.innerHTML = `<div class="loading" style="padding:30px">등록된 장소가 없습니다</div>`;
    return;
  }
  // 카테고리별 그룹
  const byGroup = {};
  filtered.forEach(p => { (byGroup[p.cat] = byGroup[p.cat] || []).push(p); });
  el.innerHTML = Object.entries(byGroup).map(([g, list]) => {
    const c = cat(g);
    return `<div class="h3">${c.e} ${g} · ${list.length}</div>` +
      list.map(p => {
        const won = /\d/.test(p.price) ? wonHint(p.price) : '';
        return `<div class="place-item" onclick="openPlaceById('${p.id}')">
          <div class="place-thumb" style="background:${c.c}22">${c.e}</div>
          <div class="place-body">
            <div class="place-name">${p.name}</div>
            <div class="place-vn">${p.nameVn || p.addr}</div>
            <div class="place-meta">
              ${p.rating ? `<span>⭐ ${p.rating}</span>` : ''}
              ${p.price ? `<span>💵 ${p.price}${won ? ` <span class="muted">(${won})</span>` : ''}</span>` : ''}
              ${p.reserve === 'O' ? `<span>📅 예약필요</span>` : ''}
              ${p.kids === 'O' ? `<span>👶 유아 O</span>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
  }).join('');
}

function wonHint(price){
  const m = price.match(/(\d+(?:[,.]?\d+)?)\s*만/);
  if(m){
    const v = parseFloat(m[1].replace(',',''));
    return `≈${(v * 10000 * CONFIG.RATE_VND_TO_KRW).toLocaleString('ko-KR', {maximumFractionDigits:0})}원`;
  }
  return '';
}

(function(){
  const drag = document.getElementById('sheet-drag');
  const sheet = document.getElementById('sheet');
  if(!drag || !sheet) return;
  let startY = null, currentY = 0;
  const onStart = (e) => {
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    sheet.style.transition = 'none';
  };
  const onMove = (e) => {
    if(startY === null) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    currentY = Math.max(0, y - startY);
    sheet.style.transform = `translateY(${currentY}px)`;
  };
  const onEnd = () => {
    if(startY === null) return;
    sheet.style.transition = '';
    if(currentY > 100) closeSheet();
    else sheet.style.transform = '';
    startY = null; currentY = 0;
  };
  drag.addEventListener('touchstart', onStart, {passive:true});
  drag.addEventListener('touchmove', onMove, {passive:true});
  drag.addEventListener('touchend', onEnd);
  drag.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
})();

function renderPhrases(filter=''){

function speak(text){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN';
    u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } else {
    toast('브라우저가 음성을 지원하지 않아요');
  }
}
function calcKrw(){
  const v = parseFloat(document.getElementById('vnd').value) || 0;
  document.getElementById('krw').value = wonFromVnd(v);
}
function swapConv(){
  const k = parseFloat(document.getElementById('krw').value) || 0;
  document.getElementById('vnd').value = Math.round(k / CONFIG.RATE_VND_TO_KRW);
  calcKrw();
}
document.getElementById('vnd').addEventListener('input', calcKrw);
document.getElementById('phrase-search').addEventListener('input', e => renderPhrases(e.target.value));

/* ═══════════════════════════════════════
   초기화
   ═══════════════════════════════════════ */
async function init(){
  calcKrw();

  await loadAll();

  if(state.error){
    document.getElementById('home-body').innerHTML = `
      <div class="banner">
        <b>⚠️ 데이터를 불러오지 못했습니다.</b><br>
        ${state.error}<br><br>
        <b>확인할 것:</b><br>
        1. 구글 시트가 "링크가 있는 모든 사용자 - 뷰어"로 공유되었나요?<br>
        2. 시트 1행이 헤더인가요? (v2 템플릿 필요)<br>
        3. <a href="https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit" target="_blank">시트 열기</a>
      </div>`;
    return;
  }

  renderHome();
  renderPlanTabs();
  renderPlanBody();
  renderMapFilters();
  renderPhrases();
  renderPlaces();
  updateSyncLabel();
  // 지도 탭 눌렀을 때 initMap() 호출됨 (switchTab에서)
}
init();
</script>
