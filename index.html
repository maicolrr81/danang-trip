<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#0a1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="다낭 여행" />
<title>다낭 가족여행</title>

<script>
  window.gmapsReady = false;
  window.initGMaps = () => {
    window.gmapsReady = true;
    window.dispatchEvent(new CustomEvent('gmaps-ready'));
  };
</script>
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDrOQN-gpIHZoC3t-l9z_8uC_c3m9kpcW4&loading=async&libraries=marker&callback=initGMaps&v=weekly&language=ko&region=VN">
</script>

<style>
  :root{
    --bg:#0a1220; --panel:#131a2c; --ink:#eef2f8; --sub:#8a95ad;
    --line:#232b40; --brand:#2dd4bf; --brand2:#fb7185; --ok:#34d399;
    --card:#1a2338; --card2:#202b45;
    --sand:#fbbf24; --sky:#38bdf8;
    --food:#fb7185; --spa:#c084fc; --nail:#f472b6; --shop:#fbbf24;
    --sight:#2dd4bf; --stay:#fb923c; --cafe:#a3e635; --move:#38bdf8;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
    overscroll-behavior-y:contain;
  }
  body{max-width:500px;margin:0 auto;min-height:100vh;position:relative}
  button, input, textarea, select{font-family:inherit}
  button{cursor:pointer;background:none;border:none;color:inherit;padding:0}
  a{color:var(--brand);text-decoration:none}

  /* ─── 레이아웃 ─── */
  .screen{display:none;padding-top:var(--safe-top);padding-bottom:calc(84px + var(--safe-bot));min-height:100vh}
  .screen.on{display:block}
  .header{padding:14px 18px 4px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 70%,rgba(10,18,32,0));z-index:10}
  .header h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-0.3px}
  .header .sub{color:var(--sub);font-size:12px;margin-top:2px}
  .header .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .body-p{padding:8px 16px 20px}

  /* ─── 탭바 ─── */
  .tabbar{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;height:calc(72px + var(--safe-bot));padding-bottom:var(--safe-bot);background:rgba(19,26,44,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:50}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:10px;font-weight:600;transition:color .15s}
  .tab .ic{font-size:20px;line-height:1}
  .tab.on{color:var(--brand)}
  .tab:active{transform:scale(.94)}

  /* ─── 공통 컴포넌트 ─── */
  .card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .muted{color:var(--sub);font-size:12px}
  .h3{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;margin:16px 4px 8px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--card2);color:var(--ink);font-size:12px;font-weight:600;border:1px solid var(--line)}
  .btn.primary{background:var(--brand);color:#0a1220;border-color:transparent;font-weight:700}
  .btn.block{display:flex;width:100%;justify-content:center;padding:13px}
  .btn:active{transform:scale(.97)}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#252b3a;color:#c8d0e0}
  .chip.on{background:var(--brand);color:#0a1220}
  .chip.stay{background:rgba(251,146,60,.18);color:var(--stay)}
  .chip.food{background:rgba(251,113,133,.18);color:var(--food)}
  .chip.spa{background:rgba(192,132,252,.18);color:var(--spa)}
  .chip.nail{background:rgba(244,114,182,.18);color:var(--nail)}
  .chip.shop{background:rgba(251,191,36,.18);color:var(--shop)}
  .chip.sight{background:rgba(45,212,191,.18);color:var(--sight)}
  .chip.cafe{background:rgba(163,230,53,.18);color:var(--cafe)}
  .chip.move{background:rgba(56,189,248,.18);color:var(--move)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--sub);font-size:13px}
  .loading::before{content:"";width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ─── 홈 ─── */
  .hero{background:linear-gradient(135deg,#2dd4bf 0%,#0891b2 60%,#164e63 100%);border-radius:20px;padding:20px;color:#fff;margin-bottom:12px;box-shadow:0 8px 24px rgba(45,212,191,.15)}
  .hero .dday{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
  .hero .caption{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
  .hero .dates{font-size:12px;margin-top:10px;font-weight:600;opacity:.9}
  .today-card{background:linear-gradient(160deg,rgba(45,212,191,.08),rgba(251,113,133,.06));border:1px solid rgba(45,212,191,.25);border-radius:16px;padding:14px;margin-bottom:12px}
  .today-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .today-tag{background:var(--brand);color:#0a1220;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .today-item{display:flex;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
  .today-item:first-of-type{border-top:0}
  .ti-time{flex:0 0 44px;font-size:12px;font-weight:700;color:var(--brand);padding-top:2px}
  .ti-body{flex:1;font-size:13px}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .mini .lbl{color:var(--sub);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .mini .val{font-size:15px;font-weight:700;margin-top:4px}
  .mini .sm{color:var(--sub);font-size:11px;margin-top:2px}

  /* ─── 일정 ─── */
  .day-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{flex:0 0 auto;min-width:64px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center;position:relative}
  .day-tab .dt-date{font-size:14px;font-weight:800;color:var(--ink)}
  .day-tab .dt-day{font-size:10px;color:var(--sub);margin-top:2px}
  .day-tab .dt-count{position:absolute;top:6px;right:8px;background:var(--sub);color:var(--bg);font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .day-tab.on{background:var(--brand);border-color:transparent;box-shadow:0 4px 12px rgba(45,212,191,.3)}
  .day-tab.on .dt-date,.day-tab.on .dt-day{color:#0a1220}
  .day-tab.on .dt-count{background:#0a1220;color:var(--brand)}
  .timeline{position:relative;padding-left:22px;margin-top:4px}
  .timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
  .tl-item{position:relative;margin-bottom:14px}
  .tl-item::before{content:"";position:absolute;left:-20px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--brand);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--brand)}
  .tl-time{font-size:11px;color:var(--brand);font-weight:700;margin-bottom:4px;letter-spacing:.3px}
  .tl-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .tl-card .name{font-weight:700;font-size:14px}
  .tl-card .memo{color:var(--sub);font-size:11px;margin-top:4px}

  /* ─── 지도 ─── */
  .search-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .search-bar input{border:0;background:transparent;padding:0;font-size:13px;color:var(--ink);flex:1;outline:none}
  .filter-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-bar .chip{flex:0 0 auto;user-select:none}
  .map-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;background:#1a2338}
  #mapMain{width:100%;height:60vh;min-height:340px}
  .gmap-marker{width:34px;height:44px;position:relative;transform:translate(-50%,-100%);cursor:pointer;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
  .gmap-marker .pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;position:absolute;top:0;left:0}
  .gmap-marker .pin span{transform:rotate(45deg);font-size:16px;line-height:1}
  .gmap-marker.stay-marker{filter:drop-shadow(0 4px 10px rgba(251,146,60,.6)) drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .gmap-info{padding:2px 4px;font-size:12px;color:#111;max-width:200px}
  .gmap-info b{font-size:13px;display:block;margin-bottom:2px}
  .gmap-info a{color:#0891b2;font-weight:600;font-size:11px}
  /* Google Maps 다크 팝업 */
  .gm-style-iw{background:var(--card)!important;color:var(--ink)!important;border-radius:12px!important;padding:10px!important}
  .gm-style-iw-d{overflow:auto!important;color:var(--ink)!important}
  .gm-style-iw-c{padding:8px!important;background:var(--card)!important}
  .gm-style-iw-tc::after{background:var(--card)!important}
  .gm-ui-hover-effect{filter:invert(1)}

  /* ─── 장소 리스트 ─── */
  .place-item{display:flex;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:transform .1s}
  .place-item:active{transform:scale(.98)}
  .place-thumb{width:52px;height:52px;border-radius:12px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;font-size:24px}
  .place-body{flex:1;min-width:0}
  .place-name{font-weight:700;font-size:14px}
  .place-vn{color:var(--sub);font-size:11px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place-meta{display:flex;gap:8px;margin-top:6px;color:var(--sub);font-size:11px;flex-wrap:wrap}

  /* ─── 정보 ─── */
  .conv-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .conv-row{display:flex;gap:8px;align-items:center}
  .conv-col{flex:1}
  .conv-lbl{color:var(--sub);font-size:10px;font-weight:600}
  .conv-input{width:100%;background:transparent;border:0;color:var(--ink);font-size:22px;font-weight:800;padding:2px 0;outline:none;margin-top:2px}
  .conv-input[readonly]{color:var(--brand)}
  .conv-swap{background:var(--card2);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;color:var(--brand);font-size:14px;flex:0 0 36px}
  .conv-rate{color:var(--sub);font-size:11px;text-align:center;margin-top:10px}
  .phrase-cat{font-size:11px;font-weight:700;color:var(--brand);margin:14px 4px 8px;letter-spacing:.3px}
  .phrase{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
  .phrase .ko{flex:0 0 88px;font-size:12px;color:var(--sub);font-weight:600}
  .phrase .vn{flex:1;font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
  .phrase .pron{color:var(--sub);font-size:11px;font-weight:400;display:block;margin-top:1px}
  .phrase .spk{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--brand);font-size:14px;flex:0 0 32px}

  /* ─── 상세 시트 (bottom sheet) ─── */
  .sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;animation:fadeIn .2s}
  .sheet-back.on{display:block}
  .sheet{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:var(--panel);border-radius:24px 24px 0 0;z-index:101;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + var(--safe-bot))}
  .sheet.on{transform:translateY(0)}
  .sheet-drag{width:40px;height:4px;background:var(--line);border-radius:2px;margin:10px auto}
  .sheet-body{padding:6px 20px 20px}
  .sheet .cover{height:140px;border-radius:16px;position:relative;overflow:hidden;margin-bottom:14px;display:flex;align-items:flex-end;padding:14px}
  .sheet .cover .badge{background:rgba(0,0,0,.4);color:#fff;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:600;backdrop-filter:blur(6px)}
  .addr-copy{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px}
  .addr-copy .vn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#c8d0e0;flex:1;line-height:1.4}
  .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--sub)}
  .kv .v{font-weight:600;text-align:right}
  .cta-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .memo-item{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:12px;line-height:1.5}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ─── 토스트 ─── */
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--brand);color:var(--ink);padding:12px 20px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.on{opacity:1}

  /* ─── 에러 배너 ─── */
  .banner{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:var(--sand);padding:10px 14px;border-radius:12px;font-size:12px;margin:10px 16px;line-height:1.5}
  .banner b{color:#fef3c7}

  /* 홈 미니 지도 */
  .mini-map-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);height:180px;position:relative}
  #mapHome{width:100%;height:100%}
  .mini-map-info{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;background:rgba(10,18,32,.85);backdrop-filter:blur(10px);padding:6px 8px;border-radius:10px}
</style>
</head>
<body>

<!-- ═══════════ 홈 ═══════════ -->
<section class="screen on" id="screen-home">
  <div class="header">
    <div class="row">
      <div>
        <h1>🌴 다낭 여행</h1>
        <div class="sub">우리 가족 14명 · 4박 5일</div>
      </div>
    </div>
  </div>
  <div class="body-p" id="home-body">
    <div class="loading">불러오는 중...</div>
  </div>
</section>

<!-- ═══════════ 일정 ═══════════ -->
<section class="screen" id="screen-plan">
  <div class="header">
    <div class="row">
      <div>
        <h1>일정</h1>
        <div class="sub">4박 5일 타임라인</div>
      </div>
    </div>
  </div>
  <div class="body-p">
    <div class="day-tabs" id="day-tabs"></div>
    <div id="day-body"><div class="loading">불러오는 중...</div></div>
  </div>
</section>

<!-- ═══════════ 지도 ═══════════ -->
<section class="screen" id="screen-map">
  <div class="header">
    <div class="row">
      <div>
        <h1>지도</h1>
        <div class="sub" id="map-sub">📍 로딩 중...</div>
      </div>
    </div>
  </div>
  <div class="body-p" style="padding:0 12px 12px">
    <div class="search-bar">
      <span>🔍</span>
      <input id="map-search" placeholder="장소·주소·베트남어 검색" />
    </div>
    <div class="filter-bar" id="map-filters"></div>
    <div class="map-wrap"><div id="mapMain"></div></div>
  </div>
</section>

<!-- ═══════════ 장소 ═══════════ -->
<section class="screen" id="screen-places">
  <div class="header">
    <div class="row">
      <div>
        <h1>장소</h1>
        <div class="sub" id="places-sub">전체 장소</div>
      </div>
      <button class="btn primary" onclick="openAddPlace()">＋</button>
    </div>
  </div>
  <div class="body-p">
    <div class="filter-bar" id="places-filters"></div>
    <div id="places-list"><div class="loading">불러오는 중...</div></div>
  </div>
</section>

<!-- ═══════════ 정보 ═══════════ -->
<section class="screen" id="screen-info">
  <div class="header">
    <div class="row">
      <div>
        <h1>정보</h1>
        <div class="sub">환율 · 회화 · 준비물</div>
      </div>
    </div>
  </div>
  <div class="body-p">

    <div class="h3">💱 환율 계산기</div>
    <div class="conv-card">
      <div class="conv-row">
        <div class="conv-col">
          <div class="conv-lbl">🇻🇳 VND (동)</div>
          <input class="conv-input" id="vnd" type="number" value="100000" inputmode="numeric" />
        </div>
        <button class="conv-swap" onclick="swapConv()">⇄</button>
        <div class="conv-col" style="text-align:right">
          <div class="conv-lbl">🇰🇷 KRW (원)</div>
          <input class="conv-input" id="krw" type="number" readonly style="text-align:right" />
        </div>
      </div>
      <div class="conv-rate" id="conv-rate">환율: 1,000동 ≈ 55원</div>
    </div>
    <div class="card" style="padding:6px 14px">
      <div class="kv"><span class="k">10,000동 (1만)</span><span class="v">≈ 550원</span></div>
      <div class="kv"><span class="k">100,000동 (10만)</span><span class="v">≈ 5,500원</span></div>
      <div class="kv"><span class="k">500,000동 (50만)</span><span class="v">≈ 27,500원</span></div>
      <div class="kv"><span class="k">1,000,000동 (100만)</span><span class="v">≈ 55,000원</span></div>
    </div>

    <div class="h3">🗣 기본 베트남어</div>
    <div class="search-bar" style="margin-bottom:8px">
      <span>🔍</span>
      <input id="phrase-search" placeholder="문장 검색" />
    </div>
    <div id="phrase-body"><div class="loading">불러오는 중...</div></div>

  </div>
</section>

<!-- ═══════════ 탭바 ═══════════ -->
<nav class="tabbar">
  <button class="tab on" data-tab="home"><span class="ic">🏠</span>홈</button>
  <button class="tab" data-tab="plan"><span class="ic">📅</span>일정</button>
  <button class="tab" data-tab="map"><span class="ic">🗺️</span>지도</button>
  <button class="tab" data-tab="places"><span class="ic">📍</span>장소</button>
  <button class="tab" data-tab="info"><span class="ic">ℹ️</span>정보</button>
</nav>

<!-- ═══════════ 상세 시트 ═══════════ -->
<div class="sheet-back" id="sheet-back" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-drag"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════
   설정
   ═══════════════════════════════════════ */

async function fetchSheet(name){
  const url = `https://opensheet.elk.sh/${CONFIG.SHEET_ID}/${encodeURIComponent(name)}`;
  try {
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) {
    console.warn('Sheet fetch failed:', name, e);
    return null;
  }
}

async function loadAll(){
  const [places, plan, phrases] = await Promise.all([
    fetchSheet('장소'),
    fetchSheet('일정'),
    fetchSheet('회화'),
  ]);

  if(!places || !plan){
    state.error = '시트에서 데이터를 불러오지 못했습니다. 시트 공유 설정을 확인해주세요.';
    return;
  }

  state.places = places.filter(p => p['이름_한글'] || p['이름(한글)']).map(p => ({
    id: p['ID'] || '',
    name: p['이름_한글'] || p['이름(한글)'] || '',
    nameVn: p['이름_현지'] || p['이름(현지)'] || '',
    cat: (p['카테고리'] || '기타').trim(),
    addr: p['주소'] || p['주소(베트남어)'] || '',
    lat: parseFloat(p['위도']) || null,
    lng: parseFloat(p['경도']) || null,
    price: p['가격대'] || '',
    hours: p['영업시간'] || '',
    reserve: p['예약필요'] || '',
    kids: p['유아가능'] || '',
    rating: p['별점'] || '',
    memo: p['메모'] || '',
    mapUrl: p['구글맵링크'] || '',
  }));

  state.plan = plan.filter(p => p['일차']).map(p => ({
    day: p['일차'] || '',
    date: p['날짜'] || '',
    dow: p['요일'] || '',
    time: p['시간'] || '',
    placeId: p['장소ID'] || '',
    name: p['장소이름'] || '',
    cat: (p['카테고리'] || '기타').trim(),
    memo: p['메모'] || '',
    done: p['완료'] || '',
  }));

  state.phrases = (phrases || []).filter(p => p['한국어']).map(p => ({
    cat: p['카테고리'] || '기타',
    ko: p['한국어'] || '',
    vn: p['베트남어'] || '',
    pron: p['한글발음'] || '',
    memo: p['메모'] || '',
  }));

  state.loaded = true;
}

function dayLabel(d){
  const days = {D1:'10/22', D2:'10/23', D3:'10/24', D4:'10/25', D5:'10/26'};
  const dows = {D1:'목', D2:'금', D3:'토', D4:'일', D5:'월'};
  return {date:days[d]||'', dow:dows[d]||'', full:d};
}
function ddayText(){
  const t = new Date(CONFIG.TRIP_START + 'T00:00:00+09:00');
  const now = new Date();
  const diff = Math.ceil((t - now) / 86400000);
  if(diff > 0) return {label:'출발까지', dday:`D-${diff}`};
  if(diff === 0) return {label:'오늘', dday:'D-Day'};
  const end = new Date(CONFIG.TRIP_END + 'T23:59:59+09:00');
  if(now <= end) return {label:'여행 중', dday:`D+${-diff}`};
  return {label:'여행 종료', dday:'-'};
}
function currentDayCode(){
  // 오늘 날짜에 맞는 D1~D5 반환 (없으면 null)
  const map = {'2026-10-22':'D1','2026-10-23':'D2','2026-10-24':'D3','2026-10-25':'D4','2026-10-26':'D5'};
  const today = new Date().toISOString().slice(0,10);
  return map[today] || null;
}
function cat(name){ return CATS[name] || CATS.기타; }
function wonFromVnd(v){ return Math.round(v * CONFIG.RATE_VND_TO_KRW); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1800);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('복사됨'); }
  catch { toast('복사 실패 — 길게 눌러 복사'); }
}

function switchTab(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.getElementById('screen-' + name).classList.add('on');
  document.querySelector(`[data-tab="${name}"]`).classList.add('on');
  window.scrollTo(0, 0);
  // 지도 탭 활성화되면 초기화 or 사이즈 재계산
  if(name === 'map'){
    if(!state.mapMain) initMap();
    else setTimeout(() => google.maps.event.trigger(state.mapMain, 'resize'), 100);
  }
  if(name === 'home' && state.mapHome){
    setTimeout(() => google.maps.event.trigger(state.mapHome, 'resize'), 100);
  }
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

/* ═══════════════════════════════════════
   지도 렌더
   ═══════════════════════════════════════ */
function makePin(color, emoji, extraClass=''){
  const wrap = document.createElement('div');
  wrap.className = 'gmap-marker ' + extraClass;
  const pin = document.createElement('div');
  pin.className = 'pin';
  pin.style.background = color;
  pin.innerHTML = `<span>${emoji}</span>`;
  wrap.appendChild(pin);
  return wrap;
}
function renderMapFilters(){
  const el = document.getElementById('map-filters');
  const all = Object.keys(CATS).filter(k => k !== '기타' && state.places.some(p => p.cat === k));
  const total = state.places.filter(p => p.lat && p.lng).length;
  el.innerHTML = `<span class="chip ${state.mapFilters.size === 0 ? 'on' : ''}" data-cat="">전체 ${total}</span>` +
    all.map(c => {
      const cnt = state.places.filter(p => p.cat === c && p.lat && p.lng).length;
      return `<span class="chip ${cat(c).chip} ${state.mapFilters.has(c) ? 'on' : ''}" data-cat="${c}">${cat(c).e} ${cnt}</span>`;
    }).join('');
  el.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    const c = chip.dataset.cat;
    if(c === '') state.mapFilters.clear();
    else {
      if(state.mapFilters.has(c)) state.mapFilters.delete(c);
      else state.mapFilters.add(c);
    }
    renderMapFilters();
    renderMapMarkers();
  }));
  document.getElementById('map-sub').textContent = `📍 ${total}곳 · ${state.places.length}개 등록됨`;
}
async function renderMapMarkers(){
  if(!state.mapMain) return;
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
  state.mapMarkers.forEach(m => m.map = null);
  state.mapMarkers = [];
  const filtered = state.places.filter(p => {
    if(!p.lat || !p.lng) return false;
    if(state.mapFilters.size === 0) return true;
    return state.mapFilters.has(p.cat);
  });
  const bounds = new google.maps.LatLngBounds();
  filtered.forEach(p => {
    const c = cat(p.cat);
    const marker = new AdvancedMarkerElement({
      position: {lat: p.lat, lng: p.lng},
      map: state.mapMain,
      content: makePin(c.c, c.e, p.cat === '숙소' ? 'stay-marker' : ''),
      title: p.name,
      gmpClickable: true,
    });
    marker.addListener('click', () => openPlace(p));
    state.mapMarkers.push(marker);
    bounds.extend({lat: p.lat, lng: p.lng});
  });
  if(filtered.length > 0){
    state.mapMain.fitBounds(bounds, 40);
    if(filtered.length === 1) state.mapMain.setZoom(15);
  }
}
async function initMap(){
  if(state.mapMain) return;
  if(!window.gmapsReady){
    window.addEventListener('gmaps-ready', initMap, {once:true});
    return;
  }
  const { Map } = await google.maps.importLibrary("maps");
  state.mapMain = new Map(document.getElementById('mapMain'), {
    center: {lat:16.055, lng:108.245}, zoom: 12,
    mapId: "DEMO_MAP_ID",
    disableDefaultUI: false,
    zoomControl: true,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
    clickableIcons: true,
    gestureHandling: 'greedy',
  });
  renderMapMarkers();
}

   장소 리스트 렌더

function renderPlaces(){
  const el = document.getElementById('places-list');
  const catNames = Object.keys(CATS).filter(k => state.places.some(p => p.cat === k));
  const fEl = document.getElementById('places-filters');
  fEl.innerHTML = `<span class="chip ${!state.placesFilter ? 'on' : ''}" data-cat="">전체 ${state.places.length}</span>` +
    catNames.map(c => {
      const cnt = state.places.filter(p => p.cat === c).length;
      return `<span class="chip ${cat(c).chip} ${state.placesFilter === c ? 'on' : ''}" data-cat="${c}">${cat(c).e} ${cnt}</span>`;
    }).join('');
  fEl.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    state.placesFilter = chip.dataset.cat || null;
    renderPlaces();
  }));

  const filtered = state.placesFilter ? state.places.filter(p => p.cat === state.placesFilter) : state.places;
  if(filtered.length === 0){
    el.innerHTML = `<div class="loading" style="padding:30px">등록된 장소가 없습니다</div>`;
    return;
  }
  // 카테고리별 그룹
  const byGroup = {};
  filtered.forEach(p => { (byGroup[p.cat] = byGroup[p.cat] || []).push(p); });
  el.innerHTML = Object.entries(byGroup).map(([g, list]) => {
    const c = cat(g);
    return `<div class="h3">${c.e} ${g} · ${list.length}</div>` +
      list.map(p => {
        const won = /\d/.test(p.price) ? wonHint(p.price) : '';
        return `<div class="place-item" onclick="openPlaceById('${p.id}')">
          <div class="place-thumb" style="background:${c.c}22">${c.e}</div>
          <div class="place-body">
            <div class="place-name">${p.name}</div>
            <div class="place-vn">${p.nameVn || p.addr}</div>
            <div class="place-meta">
              ${p.rating ? `<span>⭐ ${p.rating}</span>` : ''}
              ${p.price ? `<span>💵 ${p.price}${won ? ` <span class="muted">(${won})</span>` : ''}</span>` : ''}
              ${p.reserve === 'O' ? `<span>📅 예약필요</span>` : ''}
              ${p.kids === 'O' ? `<span>👶 유아 O</span>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
  }).join('');
}

function wonHint(price){
  const m = price.match(/(\d+(?:[,.]?\d+)?)\s*만/);
  if(m){
    const v = parseFloat(m[1].replace(',',''));
    return `≈${(v * 10000 * CONFIG.RATE_VND_TO_KRW).toLocaleString('ko-KR', {maximumFractionDigits:0})}원`;
  }
  return '';
}

function openPlaceById(id){
  const p = state.places.find(x => String(x.id) === String(id));
  if(p) openPlace(p);
}
function openPlace(p){
  const c = cat(p.cat);
  const gradient = `linear-gradient(135deg,${c.c},${c.c}88)`;
  const mapsUrl = p.mapUrl || `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  const grabUrl = `https://www.grab.com/vn/en/transport/?dropoff=${p.lat},${p.lng}`;
  const won = /\d/.test(p.price) ? wonHint(p.price) : '';

  document.getElementById('sheet-body').innerHTML = `
    <div class="cover" style="background:${gradient}">
      <span class="badge">${c.e} ${p.cat}</span>
    </div>
    <h2 style="margin:0 0 4px;font-size:22px">${p.name}</h2>
    <div class="muted">${p.nameVn}${p.rating ? ` · ⭐ ${p.rating}` : ''}</div>

    ${p.memo ? `<div class="memo-item" style="margin-top:14px">${p.memo}</div>` : ''}

    ${p.addr ? `
      <div class="h3">주소 (그랩 기사에게 보여주기)</div>

      ${p.reserve ? `<div class="kv"><span class="k">예약 필요</span><span class="v">${p.reserve}</span></div>` : ''}
      ${p.kids ? `<div class="kv"><span class="k">유아 동반</span><span class="v">${p.kids}</span></div>` : ''}
    </div>

    ${p.lat && p.lng ? `
      <div class="cta-row">
        <a class="btn block primary" href="${mapsUrl}" target="_blank" rel="noopener">🗺 구글맵 열기</a>
        <a class="btn block" href="${grabUrl}" target="_blank" rel="noopener">🚕 그랩 호출</a>
      </div>` : ''}
  `;
  document.getElementById('sheet-back').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('sheet-back').classList.remove('on');
}
function openAddPlace(){

      <div style="margin-top:8px">

/* ═══════════════════════════════════════
   회화·환율 (정보 탭)
   ═══════════════════════════════════════ */
function renderPhrases(filter=''){
  const el = document.getElementById('phrase-body');
  const q = filter.trim().toLowerCase();
  const list = state.phrases.filter(p =>
    !q || p.ko.toLowerCase().includes(q) || p.vn.toLowerCase().includes(q) || p.pron.toLowerCase().includes(q)
  );
  if(list.length === 0){
    el.innerHTML = `<div class="loading" style="padding:20px">문장이 없어요</div>`;
    return;
  }
  const byGroup = {};
  list.forEach(p => { (byGroup[p.cat] = byGroup[p.cat] || []).push(p); });
  el.innerHTML = Object.entries(byGroup).map(([g, arr]) => `
    <div class="phrase-cat">${g}</div>
    ${arr.map(p => `
      <div class="phrase">
        <div class="ko">${p.ko}</div>
        <div class="vn">${p.vn}<span class="pron">(${p.pron})</span></div>
        <button class="spk" onclick="speak('${p.vn.replace(/'/g,"\\'")}')">🔊</button>
      </div>`).join('')}
  `).join('');
}
function speak(text){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN';
    u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } else {
    toast('브라우저가 음성을 지원하지 않아요');
  }
}
function calcKrw(){
  const v = parseFloat(document.getElementById('vnd').value) || 0;
  document.getElementById('krw').value = wonFromVnd(v);
}
function swapConv(){
  const k = parseFloat(document.getElementById('krw').value) || 0;
  document.getElementById('vnd').value = Math.round(k / CONFIG.RATE_VND_TO_KRW);
  calcKrw();
}
document.getElementById('vnd').addEventListener('input', calcKrw);
document.getElementById('phrase-search').addEventListener('input', e => renderPhrases(e.target.value));

/* ═══════════════════════════════════════
   초기화
   ═══════════════════════════════════════ */
async function init(){
  calcKrw();

  await loadAll();

  if(state.error){
    document.getElementById('home-body').innerHTML = `
      <div class="banner">
        <b>⚠️ 데이터를 불러오지 못했습니다.</b><br>
        ${state.error}<br><br>
        <b>확인할 것:</b><br>
        1. 구글 시트가 "링크가 있는 모든 사용자 - 뷰어"로 공유되었나요?<br>
        2. 시트 1행이 헤더인가요? (v2 템플릿 필요)<br>
        3. <a href="https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit" target="_blank">시트 열기</a>
      </div>`;
    return;
  }

  renderHome();
  renderPlanTabs();
  renderPlanBody();
  renderMapFilters();
  renderPhrases();
  renderPlaces();
  // 지도 탭 눌렀을 때 initMap() 호출됨 (switchTab에서)
}
init();
</script>
